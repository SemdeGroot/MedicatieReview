name: Build & Push Docker Image (GHCR)

on:
  push:
    branches: [ main ]   # bouwt automatisch bij push naar main
  workflow_dispatch:     # handmatig starten via Actions-tab

env:
  IMAGE_NAME: medicatiereview-webapp
  IMAGE_TAG: py310
  REGISTRY: ghcr.io
  # Eindtag wordt: ghcr.io/<GHCR_USER>/<IMAGE_NAME>:<IMAGE_TAG>

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # nodig om naar GHCR te pushen
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.GHCR_USER }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build & Push (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.medicatiereview
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/$(echo "${{ secrets.GHCR_USER }}" | tr '[:upper:]' '[:lower:]')/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/$(echo "${{ secrets.GHCR_USER }}" | tr '[:upper:]' '[:lower:]')/${{ env.IMAGE_NAME }}:latest
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ secrets.GHCR_USER }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ secrets.GHCR_USER }}/${{ env.IMAGE_NAME }}:buildcache,mode=max
